<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Income Tax Calculator</title>
    <style>
        body {
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #f0f4f8;
            font-family: Arial, sans-serif;
        }

        h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }

        #card {
            background-color: #fff;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 360px;
        }

        label {
            font-size: 14px;
            color: #555;
            font-weight: bold;
        }

        input[type="number"] {
            width: 100%;
            height: 48px;
            font-size: 18px;
            padding: 0 12px;
            margin-top: 6px;
            margin-bottom: 20px;
            border: 2px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
        }

        input[type="number"]:focus {
            border-color: #4f8ef7;
        }

        #result {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            color: #2ecc71;
            background-color: #f0fff4;
            border: 2px solid #2ecc71;
            border-radius: 8px;
            padding: 12px;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
            font-size: 13px;
            color: #555;
        }

        th {
            background-color: #f0f4f8;
            padding: 6px 8px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        td {
            padding: 5px 8px;
            border-bottom: 1px solid #eee;
        }
    </style>
</head>
<body>
    <div id="card">
        <h1>Income Tax Calculator</h1>
        <form>
            <label for="income">Annual Income (₹)</label>
            <input type="number" id="income" placeholder="Enter your income">
        </form>
        <div id="result">Tax: ₹0</div>

        <table>
            <tr><th>Income Range</th><th>Tax Rate</th></tr>
            <tr><td>₹0 – ₹4,00,000</td><td>0%</td></tr>
            <tr><td>₹4,00,001 – ₹8,00,000</td><td>5%</td></tr>
            <tr><td>₹8,00,001 – ₹12,00,000</td><td>10%</td></tr>
            <tr><td>₹12,00,001 – ₹16,00,000</td><td>15%</td></tr>
            <tr><td>₹16,00,001 – ₹20,00,000</td><td>20%</td></tr>
            <tr><td>₹20,00,001 – ₹24,00,000</td><td>25%</td></tr>
            <tr><td>Above ₹24,00,000</td><td>30%</td></tr>
        </table>
    </div>

    <script src="./script.js"></script>
</body>
</html>
