<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Color Changer</title>
    <style>
        body {
            background-color: white;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
        }

        #root {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            padding: 20px;
            gap: 2px;
        }

        .box {
            height: 150px;
            width: 150px;
            border: none;
            cursor: pointer;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
        }

        #crimson {
            background-color: crimson;
        }

        #slateblue {
            background-color: slateblue;
        }

        #palevioletred {
            background-color: palevioletred;
        }

        #orange {
            background-color: orange;
            color: black;
        }

        #palegreen {
            background-color: palegreen;
            color: black;
        }
    </style>
</head>

<body>
    <div id="root">
        <button id="crimson" class="box">Crimson</button>
        <button id="slateblue" class="box">Slate Blue</button>
        <button id="palevioletred" class="box">Pale Violet Red</button>
        <button id="orange" class="box">Orange</button>
        <button id="palegreen" class="box">Pale Green</button>
    </div>

    <script src="script.js"></script>
</body>

</html>
