<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter</title>
    <style>
        body {
            background-color: whitesmoke;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        h1 {
            font-size: 50px;
            color: #333;
            margin: 0;
        }

        h2 {
            font-size: 80px;
            color: #333;
            margin: 5px 0 30px 0;
            line-height: 1.4;
        }

        #root {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            padding: 20px;
            gap: 20px;
        }

        .box {
            height: 60px;
            width: 180px;
            font-size: 30px;
            cursor: pointer;
            border: 2px solid;
            border-radius: 5px;
            color: white;
        }

        #buttonFirst  { background-color: #4f8ef7; border-color: #3a6fd8; }
        #buttonSecond { background-color: #2ecc71; border-color: #27ae60; }
        #buttonThird  { background-color: #e74c3c; border-color: #c0392b; }
    </style>
</head>
<body>
    <h1>COUNTER</h1>
    <h2>0</h2>
    <div id="root">
        <button id="buttonFirst" class="box">Increment</button>
        <button id="buttonSecond" class="box">Decrement</button>
        <button id="buttonThird" class="box">Reset</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
