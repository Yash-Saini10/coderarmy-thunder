<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stop Watch</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            background-color: #f0f4f8;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        h1 {
            font-size: 50px;
            color: #a5adbe;
            margin: 0;
        }

        h2 {
            font-size: 80px;
            color: #333;
            margin: 5px 0 30px 0;
            line-height: 1.4;
        }

        #root {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            padding: 20px;
            gap: 10px;
        }

        .box {
            height: 50px;
            width: 140px;
            font-size: 28px;
            cursor: pointer;
            border: 2px solid;
            border-radius: 5px;
            color: white;
        }

        #buttonFirst {
            background-color: #2ecc71;
            border-color: #27ae60;
        }

        #buttonSecond {
            background-color: #e74c3c;
            border-color: #c0392b;
        }

        #buttonThird {
            background-color: #4f8ef7;
            border-color: #3a6fd8;
        }
    </style>
</head>

<body>
    <h1>STOP WATCH</h1>
    <h2>00:00:00</h2>
    <div id="root">
        <button id="buttonFirst" class="box">Start</button>
        <button id="buttonSecond" class="box">Stop</button>
        <button id="buttonThird" class="box">Reset</button>
    </div>

    <script src="script.js"></script>
</body>

</html>
