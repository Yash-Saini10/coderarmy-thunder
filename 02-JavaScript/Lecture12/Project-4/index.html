<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olympic Countdown</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f0f4f8;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
        }

        .container {
            text-align: center;
        }

        h1 {
            font-size: 60px;
            font-weight: 800;
            color: #222;
            margin-bottom: 30px;
        }

        .timer {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .box {
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 120px;
            width: 160px;
            background-color: #222;
            color: #fff;
            border-radius: 8px;
        }

        .box span {
            font-size: 60px;
            font-weight: bold;
        }

        .box p {
            font-size: 25px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>OLYMPIC 2028</h1>
        <div class="timer">
            <div class="box"><span id="days">00</span><p>DAYS</p></div>
            <div class="box"><span id="hours">00</span><p>HOURS</p></div>
            <div class="box"><span id="minutes">00</span><p>MINUTES</p></div>
            <div class="box"><span id="seconds">00</span><p>SECONDS</p></div>
        </div>
    </div>
    <script src="./script.js"></script>
</body>
</html>
