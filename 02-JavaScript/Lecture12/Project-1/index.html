<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Calculator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #ffe4ec;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 40px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            width: 400px;
            text-align: center;
        }

        h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 5px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            text-align: left;
        }

        label {
            font-size: 16px;
            font-weight: bold;
            color: #555;
        }

        input[type="text"] {
            height: 48px;
            padding: 10px 15px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            background-color: #fafafa;
            color: #333;
            outline: none;
            transition: border-color 0.2s;
            width: 100%;
        }

        input[type="text"]:focus {
            border-color: #e91e63;
        }

        button {
            height: 50px;
            width: 100%;
            background-color: #333;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: #555;
        }

        button:active {
            transform: scale(0.98);
        }

        h2 {
            font-size: 22px;
            color: #333;
            text-align: center;
            padding: 12px 20px;
            background-color: #ffe4ec;
            border-radius: 8px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container">

        <h1>💕 Love Calculator</h1>

        <div class="input-group">
            <label for="boy">Boy's Name</label>
            <input type="text" id="boy">
        </div>

        <div class="input-group">
            <label for="girl">Girl's Name</label>
            <input type="text" id="girl">
        </div>

        <button>Calculate</button>

        <h2>Result: </h2>

    </div>

    <script src="./script.js"></script>
</body>
</html>
